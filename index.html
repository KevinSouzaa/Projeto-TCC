<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="logo"><img src="sprites/upgrades/frango_1.png" alt=""></a>

            <section class="botoes-header">
                <div class="botoes">
                    <button id="btn-esquerda">Estatísticas</button>
                    <button id="btn-direita">Configurações</button>
                </div>
            </section>
                <div class="moeda">
                        <h3><img src="sprites/moedas/braco.png" alt="" class="braco-image" draggable="false"> <span class="moeda-custo">0</span></h3>
                </div>
                <div class="barra-prog-rebirth">
                    <h4>Rebirth</h4>
                </div>
    </header>

    <section>
        <div class="main">
            <div class="right">
             <img src="sprites/personagem/Fraco_1.png" alt="" srcset="" class="boneco-image" onclick="incrementarMoeda()" draggable="false">
            </div>

            <section id = "lojaUpgrades" class="left">  <!--Seção de Upgrades-->
                <div class="upgrade" onclick="comprarUpgrade('frango')">
                    <div class="left-section">
                        <img src="sprites/upgrades/frango_lock.png" alt="" id="frango-img" class="upgrade-img">
                    </div>

                    <div class="mid-section">
                        <h4>Frango</h4>

                        <div class="preco-info">
                            <p>Preço: <span id="preco-frango">10</span> </p>
                            <img src="sprites/moedas/braco.png" alt="" class="braco-img">
                        </div>
                    </div>

                    <div class="right-section">
                        <span id="nivel-frango">0</span>
                    </div>
                </div>
            </section>

        </div>
    </section>

    <div id="overlay-configuracoes"></div>

    <section class="menu-configuracoes">
        

        <div id="configuracoes">
            <h2>Configurações</h2>

             <button id="btn-fechar-config">X</button>

            <div>
                <label>
                    <button id="btn-som">Som</button>
                </label>
            </div>
            <div>
                <label>
                    <button id="btn-salvamento">Salvamento</button>
                </label>
            </div>
            <div>
                <label>
                    <button id="btn-excluirsalvamento">Excluir Salvamento</button>
                </label>
            </div>
        </div>
    </section>
    <script src="js/sprites.js"></script> <!--Sempre o primeiro, nosso documento com os caminhos -->
    <script src="js/menu_configuracoes.js"></script>
    <script src="js/animacoes.js"></script>
    <script src="js/upgrades.js"></script>
    <script src="js/app.js"></script> <!--Sempre o ultimo, pois depende da coisa dos de cima-->
</body>
</html>
