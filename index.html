<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="#" class="logo"><img src="./foto/frango.png" alt=""></a>
            <section class="botoes-header">
                <div class="botoes">
                    <button id="bot-esquerda">Estatísticas</button>
                    <button id="bot-direita">Configurações</button>
                </div>

            </section>
                <div class="moeda">
                        <h3><img src="./foto/braco.png" alt="" class="braco-image" draggable="false"> <span class="gem-cost">0</span></h3>
                </div>
                <div class="barra-prog">
                    <h4>Rebirth</h4>
                </div>
    </header>

    <section>
        <div class="main">
            <div class="left">

             <img src="./foto/Personagem Fraco-1.png" alt="" srcset="" class="boneco-image" onclick="incrementGem()" draggable="false">
            </div>
            <div class="right">
             <div class="upgrade" onclick="comprarFrango()">
                <div class="left-section">
                    <img src="./foto/frango.png" alt="" class="frango-img">
                </div>

                <div class="mid-section">
                    <h4>Frango</h4>
                    <div class="preco-info">
                        <p>Preço: <span class="clicker-preco">10</span> </p>
                        <img src="./foto/braco.png" alt="" class="braco-img">
                    </div>
                </div>
                <div class="right-section">
                    Level 0
                </div>
             </div>
            </div>
        </div>
    </section>

    <section class="menu-configuracoes">
        <div id="configuracoes">
            <h2>Configurações</h2>

             <button id="fechar-config">X</button>

            <div>
                <label>
                    <button id="bot-som">Som</button>
                </label>
            </div>
            <div>
                <label>
                    <button id="bot-salvamento">Salvamento</button>
                </label>
            </div>
            <div>
                <label>
                    <button id="bot-excluirsalvamento">Excluir Salvamento</button>
                </label>
            </div>
        </div>
    </section>
    <script src="index.js"></script>
</body>
</html>
